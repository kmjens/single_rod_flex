[workspace]
value_file = "signac_statepoint.json"

[default.action.submit_options.greatlakes]
account="sglotzer0"

[default.action.submit_options.anvil]
account='dmr140129'
partition = "shared"
output_file_path = "output_files/"
                                                                                            
[[action]]
name = "Run"
launchers =["mpi"]
products = ['Run.out']
resources.walltime.per_submission = "3 days, 12:00:00"
resources.processes.per_directory = 1
group.maximum_size=1
command = "python ../../src/project.py --action $ACTION_NAME {directories}"


[[action]]
name = "Analysis"
launchers =["mpi"]
#products = ['analysis_data.json']
resources.walltime.per_submission = "01:00:00"
resources.processes.per_directory = 1
group.maximum_size=1
command = "python ../../src/analysis.py --action $ACTION_NAME {directories}"

[[action]]
name = "Analysis_wFFT"
launchers =["mpi"]
#products = ['analysis_data.json']
resources.walltime.per_submission = "01:00:00"
resources.processes.per_directory = 1
group.maximum_size=1
command = "python ../../src/analysis_wFFT.py --action $ACTION_NAME {directories}"

[[action]]
name = "CollectData"
launchers =["mpi"]
products = ['extracted_timestep_data.npz', 'MSD_CRG.csv']
resources.walltime.per_submission = "01:00:00"
resources.processes.per_directory = 1
group.maximum_size=1
command = "python ../../src/collect_traj_data.py --action $ACTION_NAME {directories}"

[[action]]
name = "PlotTraj"
launchers =["mpi"]
